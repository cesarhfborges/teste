[providers]
    php = true

[variables]
    NIXPACKS_PHP_VERSION = "8.2"
    NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
    nixPkgs = [
        "php82",
        "php82Packages.composer",
        "php82Extensions.gd",
        "php82Extensions.imagick",
        "php82Extensions.pdo_mysql",
        "php82Extensions.mbstring",
        "php82Extensions.xml",
        "nginx"
    ]

[phases.install]
    cmds = [
        "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev"
    ]

[start]
    # O Nixpacks automaticamente configura o Nginx + PHP-FPM quando detecta PHP e um diretório public.
    # Caso você precise rodar algum outro comando de inicialização, você pode adicionar no start.cmd, 
    # mas o comportamento padrão já serve a pasta /app/public usando o Nginx.
